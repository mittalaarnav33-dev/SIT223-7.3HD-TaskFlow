# Collect production metrics and evaluate alert rules every five seconds.
global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - '127.0.0.1:9093'

scrape_configs:
  - job_name: taskflow-production
    metrics_path: /metrics
    static_configs:
      - targets:
          - '127.0.0.1:3002'
        labels:
          environment: production
