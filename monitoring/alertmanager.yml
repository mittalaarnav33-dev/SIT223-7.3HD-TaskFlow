# Deliver firing and resolved alerts to the local incident receiver.
# We will create that receiver in the next step.
route:
  receiver: taskflow-incidents
  group_by: ['alertname']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 5m

receivers:
  - name: taskflow-incidents
    webhook_configs:
      - url: 'http://127.0.0.1:9095/alerts'
        send_resolved: true
